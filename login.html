    <style>
        body {
            font-family: "Quicksand", sans-serif;
            background-color: #020617;
            color: #e2e8f0;
            /* Slate-200 */
        }

        /* Glassmorphism Utilities - UNIFICADO Y CONSISTENTE */
        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            /* Base oscura sólida */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Glassmorphism Utilities - AHORA SÓLIDO (OPACO) */
        .glass-card {
            /* CAMBIO: Usamos colores HEX sólidos (#1e293b y #0f172a) en lugar de RGBA con transparencia */
            background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%);

            /* El backdrop-filter ya no es necesario si el fondo es opaco, pero no daña dejarlo */
            /* backdrop-filter: blur(16px); */

            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* Scrollbar Personalizada Dark */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 2px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Modals & Sheets */
        .modal-enter {
            opacity: 0;
            transform: scale(0.95);
        }

        .modal-enter-active {
            opacity: 1;
            transform: scale(1);
            transition: opacity 0.2s, transform 0.2s;
        }

        /* Animations */
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        .slide-up {
            animation: slideUp 0.4s ease-out forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Busca esto en login.html y reemplázalo */
        @media print {

            /* CORRECCIÓN: Agregamos !important para anular el bg-dark_bg de Tailwind */
            body {
                background-color: white !important;
                color: black !important;
                height: auto !important;
                /* Evita que ocupe el 100vh oscuro */
                overflow: visible !important;
            }

            /* Aseguramos que el fondo no se cuele por ningún lado */
            html {
                background-color: white !important;
            }

            body * {
                visibility: hidden;
            }

            #print-area,
            #print-area * {
                visibility: visible;
            }

            #print-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                margin: 0;
                padding: 0;
                background-color: white !important;
                /* Fondo blanco forzado */
                display: block !important;
                z-index: 9999;
            }

            .no-print {
                display: none !important;
            }

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }

        /* Canvas Background */
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            /* Detrás de todo */
            pointer-events: none;
            /* Click-through */
        }

        .logo-text-gradient {
            /* Degradado horizontal para el texto Latam5S (simula las redes sociales) */
            background: linear-gradient(to right, #3B82F6, #60A5FA, #2DD4BF, #10B981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            /* Compatible con otros navegadores */
            color: transparent;
            /* Fallback */
        }
    </style>
</head>
