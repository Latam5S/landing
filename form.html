<!DOCTYPE html>
<html lang="es">

<head>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <meta charset="UTF-8">
    <script type="module" src="/env-logger.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Latam5S — En Mantenimiento</title>
    <meta name="description" content="Actualmente estamos en mantenimiento. Estaremos de vuelta en aproximadamente 30 minutos. Disculpa las molestias.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#ffffff">

    <meta property="og:title" content="Latam5S — En Mantenimiento">
    <meta property="og:image" content="https://raw.githubusercontent.com/complicidad/landing/main/brand3.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',     /* Azul eléctrico */
                        primary_glow: '#60A5FA',
                        secondary: '#10B981',   /* Verde éxito */
                        dark_bg: '#020617',     /* Negro profundo Slate-950 */
                        card_bg: '#0f172a',     /* Slate-900 */
                        glass: 'rgba(255, 255, 255, 0.03)',
                        glass_border: 'rgba(255, 255, 255, 0.08)',
                        brand_accent: '#D96B4F',
                        brand_accent_alt: '#FF8B6A',
                        brand_text: '#2b2b2b',
                        danger: '#d93025',
                        whatsapp: '#25D366',
                        whatsapp_hover: '#20bd5a',
                    },
                    fontFamily: {
                        sans: ['Quicksand', 'sans-serif'],
                    },
                    animation: {
                        'shake': 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both',
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                    },
                    keyframes: {
                        shake: { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } },
                        fadeIn: { from: { opacity: 0, transform: 'translateY(10px)' }, to: { opacity: 1, transform: 'translateY(0)' } }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: "Quicksand", sans-serif;
            background-color: #ffffff;
            color: #2b2b2b;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        input,
        select {
            -webkit-appearance: none;
            appearance: none;
        }

        .input-transition {
            transition: all 0.2s ease-in-out;
        }

        .logo-text-gradient {
            background: linear-gradient(to right, #3B82F6, #60A5FA, #2DD4BF, #10B981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
        }
    </style>
</head>

<body class="bg-slate-950 min-h-screen flex flex-col items-center justify-center text-center px-6 font-['Quicksand',sans-serif] relative overflow-hidden selection:bg-primary selection:text-white">
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -right-40 w-80 h-80 bg-primary/5 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-secondary/5 rounded-full blur-3xl"></div>
  </div>

  <div class="relative z-10 flex flex-col items-center max-w-lg w-full">
    <div class="flex items-center gap-3 mb-12">
      <div class="w-14 h-14 rounded-full bg-gradient-to-r from-blue-500 to-emerald-500 flex items-center justify-center font-extrabold text-white text-xl shadow-lg shadow-primary/20">5S</div>
      <span class="font-extrabold text-4xl text-transparent bg-clip-text bg-gradient-to-r from-blue-500 to-emerald-500">Latam5S</span>
    </div>

    <div class="w-28 h-28 rounded-full bg-amber-500/10 flex items-center justify-center mb-8 border border-amber-500/20">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-14 h-14 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
      </svg>
    </div>

    <span class="text-amber-400 font-bold text-sm uppercase tracking-[0.35em] mb-6">503 — En Mantenimiento</span>

    <h1 class="text-4xl md:text-5xl font-extrabold text-white mb-6 tracking-tight leading-tight">Estamos en Mantenimiento</h1>

    <p class="text-slate-400 text-lg md:text-xl leading-relaxed">
      Actualmente estamos trabajando para brindarte una mejor experiencia. Estaremos de vuelta en aproximadamente <strong class="text-white font-bold">30 minutos</strong>.
    </p>

    <div class="mt-10 pt-8 border-t border-slate-800 w-full max-w-sm">
      <p class="text-slate-500 text-base">Disculpa las molestias. ¡Volveremos pronto!</p>
    </div>

    <div class="mt-16 text-slate-700 text-xs font-bold uppercase tracking-[0.3em]">
      &copy; 2025 Latam5S
    </div>
  </div>
</body>
</html>
